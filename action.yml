name: 'Censor eBPF Agent'
description: 'Install and start the Censor eBPF firewall agent; pair with stop/ at job end'
author: 'FourLeggedLabs'

inputs:
  version:
    description: 'Agent release tag (e.g. v0.1.0) or "latest"'
    required: false
    default: 'latest'
  api-url:
    description: 'Censor API base URL'
    required: true
  api-key:
    description: 'Static API key written to /etc/censor/api-key'
    required: true
  config-file:
    description: 'Optional local policy file path (skips API fetch)'
    required: false
    default: ''
  github-actions:
    description: 'Enable GHA preset (DNS DNAT, Docker DNS, GitHub host auto-allow)'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install censor agent
      shell: bash
      env:
        CENSOR_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64) GOARCH=amd64 ;;
          aarch64|arm64) GOARCH=arm64 ;;
          *) echo "unsupported arch: $ARCH"; exit 1 ;;
        esac
        if [ "$CENSOR_VERSION" = "latest" ]; then
          URL="https://github.com/FourLeggedLabs/censor-ebpf-agent/releases/latest/download/censor-linux-${GOARCH}"
        else
          URL="https://github.com/FourLeggedLabs/censor-ebpf-agent/releases/download/${CENSOR_VERSION}/censor-linux-${GOARCH}"
        fi
        sudo curl -fsSL -o /usr/local/bin/censor "$URL"
        sudo chmod +x /usr/local/bin/censor
        censor version || true

    - name: Configure API key
      shell: bash
      env:
        CENSOR_API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        sudo mkdir -p /etc/censor /var/run/censor /var/log/censor
        printf '%s\n' "$CENSOR_API_KEY" | sudo tee /etc/censor/api-key >/dev/null
        sudo chmod 600 /etc/censor/api-key

    - name: Start censor
      shell: bash
      env:
        CENSOR_API_URL: ${{ inputs.api-url }}
        CENSOR_CONFIG_FILE: ${{ inputs.config-file }}
        CENSOR_MATRIX: ${{ toJSON(matrix) }}
        CENSOR_GITHUB_ACTIONS: ${{ inputs.github-actions }}
      run: |
        set -euo pipefail
        EXTRA=()
        if [ "${CENSOR_GITHUB_ACTIONS}" = "true" ]; then
          EXTRA+=(--github-actions)
        fi
        if [ -n "${CENSOR_CONFIG_FILE}" ]; then
          EXTRA+=(--config "${CENSOR_CONFIG_FILE}")
        fi
        # Start blocks until SIGTERM; run in background for the job lifetime.
        sudo -E censor start --api-url "${CENSOR_API_URL}" \
          --pidfile /var/run/censor/censor.pid \
          --ready-file /var/run/censor/ready \
          --failure-file /var/run/censor/failure \
          --log /var/log/censor/agent.ndjson \
          "${EXTRA[@]}" >/var/log/censor/agent.stdout 2>/var/log/censor/agent.stderr &
        sudo censor wait-ready --timeout 45s \
          --ready-file /var/run/censor/ready \
          --failure-file /var/run/censor/failure
