name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Unit tests
        run: task test
      - name: Cross-build
        run: task build:linux

  bpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install BPF build deps
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev linux-headers-$(uname -r)
      - name: eBPF tests
        # Root for CAP_BPF / memlock so LoadCensorObjects + TestRun actually run.
        run: sudo -E env "PATH=$PATH" "HOME=$HOME" task test:bpf
